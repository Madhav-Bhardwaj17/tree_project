<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Loading PDF...</title>
    <style>
        :root {
            --toolbar-height: 56px;
            --toolbar-bg: #323639;
            --viewer-bg: #525659;
            --text-color: #f1f1f1;
            --icon-color: #f1f1f1;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--viewer-bg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Toolbar */
        .toolbar {
            height: var(--toolbar-height);
            background-color: var(--toolbar-bg);
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 100;
        }

        .toolbar-left, .toolbar-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .filename {
            font-size: 14px;
            font-weight: 500;
            max-width: 300px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .page-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 13px;
        }

        .page-controls input {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            width: 30px;
            text-align: center;
            border-radius: 2px;
        }

        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            border-right: 1px solid rgba(255,255,255,0.2);
            padding-right: 20px;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--icon-color);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .icon-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Viewer Area */
        .viewer-container {
            flex: 1;
            overflow: auto;
            display: flex;
            justify-content: center;
            padding: 30px 0;
            scroll-behavior: smooth;
        }

        .certificate-wrapper {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
            background: white;
            line-height: 0;
        }

        .certificate {
            max-width: 900px; /* Standard PDF width feel */
            width: auto;
            height: auto;
            display: block;
            transition: transform 0.2s ease-in-out;
            transform-origin: top center;
        }

        /* Print Overlay */
        @media print {
            .toolbar { display: none; }
            .viewer-container { padding: 0; background: white; overflow: visible; }
            .certificate-wrapper { box-shadow: none; }
            .certificate { width: 100%; max-width: 100%; transform: none !important; }
        }
    </style>
</head>
<body>

    <header class="toolbar">
        <div class="toolbar-left">
            <div class="icon-btn">
                <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            </div>
            <div class="filename" id="display-filename">NOC26CS67S280403888.pdf</div>
            <div class="page-controls">
                <input type="text" value="1" readonly> / 1
            </div>
        </div>

        <div class="toolbar-right">
            <div class="zoom-controls">
                <button class="icon-btn" onclick="adjustZoom(-0.1)" title="Zoom Out">
                    <svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg>
                </button>
                <span id="zoom-percent" style="font-size: 13px; min-width: 40px; text-align: center;">100%</span>
                <button class="icon-btn" onclick="adjustZoom(0.1)" title="Zoom In">
                    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                </button>
            </div>

            <button class="icon-btn" onclick="window.print()" title="Print">
                <svg viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
            </button>
            <a id="download-link" href="./certificate.png" download="NPTEL_Certificate.png" class="icon-btn" title="Download">
                <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            </a>
        </div>
    </header>

    <main class="viewer-container">
        <div class="certificate-wrapper">
            <img src="/certificate.png" alt="NPTEL Certificate" class="certificate" id="cert-img">
        </div>
    </main>

    <script>
        function updateFromUrl() {
            const path = window.location.pathname;
            const certImg = document.getElementById('cert-img');
            const downloadLink = document.getElementById('download-link');
            
            // Extract filename (e.g., from /NOC26CS67S280403888.pdf)
            const fileName = path.split('/').pop();

            // Use absolute paths for Vercel compatibility
            certImg.src = "/certificate.png";
            downloadLink.href = "/certificate.png";
            
            if (fileName && fileName.toLowerCase().endsWith('.pdf')) {
                document.getElementById('display-filename').textContent = fileName;
                document.getElementById('page-title').textContent = fileName;
                
                // Update download attribute
                const baseName = fileName.replace('.pdf', '');
                downloadLink.setAttribute('download', baseName + '.png');
            } else {
                document.getElementById('display-filename').textContent = "NOC26CS67S280403888.pdf";
                document.getElementById('page-title').textContent = "NPTEL Certificate Viewer";
            }
        }

        // Zoom Logic
        let currentZoom = 1.0;
        function adjustZoom(delta) {
            currentZoom = Math.max(0.5, Math.min(2.0, currentZoom + delta));
            const img = document.getElementById('cert-img');
            img.style.transform = `scale(${currentZoom})`;
            document.getElementById('zoom-percent').textContent = Math.round(currentZoom * 100) + '%';
        }

        // Initial call
        updateFromUrl();
    </script>
</body>
</html>
