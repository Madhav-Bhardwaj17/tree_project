<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>26CS133S685039022.pdf</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            background-color: #ffffff;
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #viewer {
            width: 100%;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }
        canvas {
            background-color: #ffffff;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.14), 0 4px 12px rgba(0, 0, 0, 0.06);
            display: block;
            max-width: 100%;
            height: auto !important;
        }
    </style>
</head>
<body>
    <div id="viewer"></div>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

        const pdfUrl = "/files/cert-data.pdf";
        const viewer = document.getElementById("viewer");

        pdfjsLib.getDocument(pdfUrl).promise.then(async (pdf) => {
            const dpr = window.devicePixelRatio || 1;
            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                const page = await pdf.getPage(pageNum);
                const nativeViewport = page.getViewport({ scale: 1.0 });
                const hiDpiViewport = page.getViewport({ scale: 1.0 * dpr });

                const canvas = document.createElement("canvas");
                const ctx = canvas.getContext("2d");

                canvas.width = hiDpiViewport.width;
                canvas.height = hiDpiViewport.height;
                canvas.style.width = nativeViewport.width + "px";
                canvas.style.aspectRatio = `${nativeViewport.width} / ${nativeViewport.height}`;

                viewer.appendChild(canvas);
                await page.render({ canvasContext: ctx, viewport: hiDpiViewport }).promise;
            }
        }).catch((err) => {
            viewer.textContent = "PDF Load Error: " + err.message;
            viewer.style.color = "red";
            viewer.style.fontFamily = "monospace";
        });
    </script>
</body>
</html>
